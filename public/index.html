<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1658692912735810"
     crossorigin="anonymous"></script>
<title>What's Your Harvest Tab?</title>

<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<style>
  :root{
    --bg:#f7f7f5;
    --surface:#ffffff;
    --surface-soft:#f7f7f6;
    --surface-warm:#fbf8f3;
    --ink:#222222;
    --muted:#6d6d6d;
    --line:#e5e5e2;
    --line-dark:#d7d7d2;
    --accent:#e86f32;
    --accent-soft:#fff0e7;
    --success:#2f7d4d;
    --danger:#b8452f;
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    min-height:100%;
  }

  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
  }

  button,input{font:inherit}

  .app{
    width:100%;
    min-height:100vh;
  }

  .page{
    width:min(1400px,100%);
    margin:0 auto;
    padding:28px 30px 42px;
  }

  /* Header */
  .top{
    margin-bottom:26px;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin:0 0 9px;
    padding:6px 11px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;
    font-weight:650;
    letter-spacing:.02em;
  }

  h1{
    margin:0;
    font-size:clamp(28px,3vw,42px);
    line-height:1.12;
    letter-spacing:-.035em;
    font-weight:650;
    padding-bottom:1em;
  }

  .sub{
    max-width:760px;
    margin:10px 0 0;
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }

  /* Wizard */
  .wizard-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 30px 30px;
    box-shadow:0 2px 7px rgba(0,0,0,.025);
  }

  .wizard-label{
    position:absolute;
    top:-11px;
    left:22px;
    padding:3px 10px;
    border:1px solid #e8a27c;
    border-radius:8px;
    background:var(--surface);
    color:var(--accent);
    font-size:12px;
    font-weight:600;
  }

  .step{
    max-width:760px;
  }

  .q{
    margin:0 0 15px;
    font-size:21px;
    line-height:1.35;
    font-weight:600;
    letter-spacing:-.015em;
  }

  .hint{
    margin:-7px 0 15px;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.5;
  }

  .options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }

  .usage-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px 16px;
  max-width:760px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:7px;
  }

  .field-wide{
    grid-column:1 / -1;
  }

  .field label,
  .forecast-field label{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
  }

  .field input{
    max-width:none;
  }

  .field-hint{
    margin:5px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }

  .forecast-field{
    grid-column:1 / -1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding-top:4px;
  }

  .forecast-field .options{
    flex:none;
  }

.forecast-field .opt.forecast-selected{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--accent);
}

  .opt{
    min-height:42px;
    padding:10px 17px;
    border:1px solid var(--line-dark);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    font-size:13px;
    font-weight:550;
    transition:.15s ease;
  }

  .opt:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  input[type=number],
  input[type=email],
  input[type=text]{
    width:100%;
    max-width:620px;
    min-height:46px;
    padding:12px 14px;
    border:1px solid var(--line-dark);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    outline:none;
    font-size:15px;
  }

  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(232,111,50,.12);
  }

  .row-actions{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-top:17px;
  }

  .btn{
    min-height:42px;
    padding:10px 18px;
    border:0;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    font-size:13px;
    font-weight:650;
  }

  .btn:hover{filter:brightness(.96)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .btn.ghost{
    background:transparent;
    color:var(--muted);
    border:0;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:8px 2px;
  }

  .err{
    min-height:17px;
    margin-top:8px;
    color:var(--danger);
    font-size:12px;
  }

  /* Running activity */
  .activity-card{
    margin-top:20px;
    padding:22px 20px 20px;
    border-radius:12px;
    background:var(--surface-soft);
    border:1px solid #eeeeeb;
  }

  .activity-title{
    margin:0 0 17px;
    font-size:15px;
    font-weight:650;
  }

  .activity-title span{
    color:var(--muted);
    font-weight:400;
  }

  .activity-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
  }

  .activity-metric{
    padding:0 20px;
    border-left:1px solid var(--line);
  }

  .activity-metric:first-child{
    padding-left:0;
    border-left:0;
  }

  .metric-value{
    font-size:29px;
    line-height:1;
    font-weight:650;
    letter-spacing:-.035em;
  }

  .metric-label{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
  }

  .metric-icon{
    width:14px;
    height:14px;
    border:1.5px solid #777;
    border-radius:3px;
    display:inline-block;
    opacity:.75;
  }

  .activity-note{
    margin:20px 0 0;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.55;
  }

  /* Results */
  .results{
    margin-top:24px;
  }

  .results-section{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }

  .results-main{
    padding:25px 28px 27px;
  }

  .results-kicker{
    margin:0 0 16px;
    color:var(--muted);
    font-size:11px;
    font-weight:650;
    letter-spacing:.07em;
    text-transform:uppercase;
  }

  .entitlements{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }

  .plan-card{
    position:relative;
    min-height:330px;
    padding:25px 20px 19px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
  }

  .plan-card.current{
    border-color:#e7a57f;
    box-shadow:0 0 0 1px rgba(232,111,50,.03);
  }

  .selected{
    position:absolute;
    top:17px;
    right:17px;
    width:29px;
    height:29px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:17px;
    font-weight:700;
  }

  .plan-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:12px;
    font-weight:600;
  }

  .plan-title{
    margin:12px 0 3px;
    font-size:31px;
    line-height:1.1;
    letter-spacing:-.035em;
    font-weight:650;
  }

  .plan-description{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }

  .plan-price{
    margin-top:17px;
    font-size:28px;
    line-height:1;
    font-weight:650;
    letter-spacing:-.025em;
  }

  .plan-price small{
    color:var(--muted);
    font-size:13px;
    font-weight:400;
    letter-spacing:0;
  }

  .plan-divider{
    height:1px;
    background:var(--line);
    margin:25px 0 16px;
  }

  .plan-subtitle{
    margin:0 0 10px;
    font-size:14px;
    font-weight:650;
  }

  .entitlement-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:6px 0;
    font-size:13px;
  }

  .entitlement-label{
    display:flex;
    align-items:center;
    gap:4px;
  }

  .info{
    display:inline-grid;
    place-items:center;
    width:13px;
    height:13px;
    border:1px solid #aaa;
    border-radius:50%;
    color:#888;
    font-size:8px;
    font-weight:700;
  }

  .value-pill{
    flex:none;
    padding:5px 10px;
    border-radius:999px;
    background:#eeeeed;
    color:#606060;
    font-size:12px;
  }

  .account-activity{
    margin-top:26px;
    padding:22px 20px 20px;
    border-radius:12px;
    background:var(--surface-soft);
  }

  .account-title{
    margin:0 0 18px;
    font-size:16px;
    font-weight:650;
  }

  .account-title span{
    color:var(--muted);
    font-weight:400;
  }

  .summary-metrics{
    display:grid;
    grid-template-columns:repeat(4,1fr);
  }

  .summary-metric{
    padding:0 20px;
    border-left:1px solid var(--line-dark);
  }

  .summary-metric:first-child{
    padding-left:0;
    border-left:0;
  }

  .summary-number{
    font-size:29px;
    line-height:1;
    font-weight:650;
    letter-spacing:-.035em;
  }

  .summary-label{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
  }

  .summary-note{
    margin:22px 0 0;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.55;
  }

  .pricing-summary{
    margin-top:0;
    padding:27px 28px 25px;
    background:var(--surface-warm);
    border-top:1px solid var(--line);
  }

  .pricing-title{
    margin:0 0 21px;
    font-size:20px;
    font-weight:650;
    letter-spacing:-.02em;
  }

  .price-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:25px;
    padding:0 0 16px;
  }

  .price-item + .price-item{
    padding-top:0;
  }

  .price-name{
    font-size:14px;
  }

  .price-formula{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
  }

  .price-formula strong{
    color:var(--accent);
    font-weight:500;
  }

  .price-result{
    flex:none;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
  }

  .total{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-top:3px;
    padding-top:19px;
    border-top:1px solid var(--line);
  }

  .total-label{
    font-size:28px;
    line-height:1;
    font-weight:650;
    letter-spacing:-.035em;
  }

  .total-value{
    color:var(--accent);
    font-size:30px;
    line-height:1;
    font-weight:650;
    white-space:nowrap;
    letter-spacing:-.025em;
  }

  .total-value small{
    color:var(--muted);
    font-size:12px;
    font-weight:400;
    letter-spacing:0;
  }

  .usage-note{
    margin:17px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
  }

  .confirm{
    margin-top:18px;
    padding:13px 15px;
    border:1px solid var(--success);
    border-radius:8px;
    background:rgba(47,125,77,.07);
    color:var(--ink);
    font-size:13px;
  }

  .confirm.pending{
    border-color:var(--line-dark);
    background:#f4f4f2;
    color:var(--muted);
  }

  .confirm.error{
    border-color:var(--danger);
    background:rgba(184,69,47,.06);
  }

  .restart{
    margin-top:17px;
    text-align:center;
  }

  /* hidden helper for live answers */
  .live-answers{display:none}

  @media (max-width:900px){
    .page{padding:24px 20px 36px}
    .entitlements{gap:12px}
    .plan-card{padding:22px 17px}
    .plan-title{font-size:28px}
    .results-main{padding:22px 20px}
    .pricing-summary{padding:24px 20px}
  }

  @media (max-width:680px){
    .page{padding:20px 14px 30px}
    h1{font-size:29px}
    .sub{font-size:13.5px}
    .wizard-card{padding:25px 18px 22px}
    .q{font-size:19px}

    .activity-grid,
    .summary-metrics{
      grid-template-columns:repeat(2,1fr);
      row-gap:18px;
    }

    .activity-metric:nth-child(3),
    .summary-metric:nth-child(3){
      border-left:0;
      padding-left:0;
    }

    .activity-metric:nth-child(2),
    .summary-metric:nth-child(2){
      border-left:1px solid var(--line);
    }

    .entitlements{
      grid-template-columns:1fr;
    }

    .plan-card{min-height:auto}

    .total-label{font-size:23px}
    .total-value{font-size:25px}

    .price-item{gap:10px}
    
    .usage-form{
      grid-template-columns:1fr;
      gap:15px;
    }

    .field-wide{
      grid-column:auto;
    }

    .forecast-field{
      flex-direction:column;
      align-items:flex-start;
    }
  }

  @media (max-width:420px){
    .page{padding-left:10px;padding-right:10px}
    .wizard-card{padding:23px 15px 20px}
    .activity-card,.account-activity{padding:18px 15px}
    .results-main{padding:20px 15px}
    .pricing-summary{padding:22px 15px}
    .plan-card{padding:20px 15px}
    .summary-number,.metric-value{font-size:25px}
    .total{align-items:center}
    .total-label{font-size:20px}
    .total-value{font-size:22px}
    .usage-form{
      gap:13px;
    }

    .forecast-field .options{
      width:100%;
    }

    .forecast-field .opt{
      flex:1;
    }
  }
</style>
</head>

<body>
<div class="app">
  <div class="page">

    <header class="top">
      <p class="kicker">MONTHLY BILL ESTIMATOR · HARVEST FLEX PRICING</p>
      <h1>What's your Harvest tab this month?</h1>
      <!-- <p class="sub">
        Answer a few questions about your account.
      </p> -->
    </header>

    <section class="wizard-card" id="wizardCard">
      <div class="wizard-label">Your account</div>
      <div class="step" id="stepArea"></div>
    </section>

    <section class="activity-card" id="activityCard">
      <p class="activity-title">Account activity: <span>Usage entered so far</span></p>
      <div class="activity-grid">
        <div class="activity-metric">
          <div class="metric-value" id="liveSeats">—</div>
          <div class="metric-label"><span class="metric-icon"></span>Seats</div>
        </div>
        <div class="activity-metric">
          <div class="metric-value" id="liveProjects">—</div>
          <div class="metric-label"><span class="metric-icon"></span>Projects</div>
        </div>
        <div class="activity-metric">
          <div class="metric-value" id="liveClients">—</div>
          <div class="metric-label"><span class="metric-icon"></span>Clients</div>
        </div>
        <div class="activity-metric">
          <div class="metric-value" id="liveAmount">—</div>
          <div class="metric-label"><span class="metric-icon"></span>Amount invoiced</div>
        </div>
      </div>
      <p class="activity-note">
        Enter your current account activity above. Your figures will be reflected here
        as you move through the estimate.
      </p>
    </section>

    <section class="results" id="results"></section>

  </div>
</div>

<script>
(function(){
  const SEAT_RATE = {
    teams:      { annual: 9, monthly: 11 },
    enterprise: { annual: 14, monthly: 17.5 }
  };

  const FORECAST_ADDON = 5;

  function bandedFee(value, freeAllowance, table){
    if (value <= freeAllowance) return 0;
    for (const [upper, fee] of table){
      if (value <= upper) return fee;
    }
    return table[table.length-1][1];
  }

  const COUNT_TABLE = [[10,15],[25,50],[50,150],[100,400],[150,700],[Infinity,1000]];
  const INVOICE_TABLE = [[10,15],[20,75],[50,300],[Infinity,650]];
  const AMOUNT_TABLE  = [[20000,15],[75000,150],[200000,350],[Infinity,650]];

  const COMPETITORS = [
    { name:"OneSuite", rate:9 },
    { name:"Productive", rate:29 },
    { name:"Teamwork.com", rate:29.99 }
  ];

  const fmt = n => "$" + Number(n).toLocaleString("en-US", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

  const fmtInt = n => Number(n).toLocaleString("en-US");

  const state = {};
  let stepIndex = 0;

  const steps = [
    {
      key:"plan",
      label:"Plan",
      render(container,onNext){
        container.innerHTML = `
          <p class="q">Which Harvest plan are you on, or considering?</p>
          <div class="options">
            <button class="opt" data-v="teams">Teams</button>
            <button class="opt" data-v="enterprise">Enterprise</button>
          </div>
          <div class="err"></div>`;
        bindOptions(container,onNext);
      },
      display:v => v === "teams" ? "Teams" : "Enterprise"
    },
    {
      key:"billing",
      label:"Billing",
      render(container,onNext){
        container.innerHTML = `
          <p class="q">How do you pay for it?</p>
          <div class="options">
            <button class="opt" data-v="annual">Annual</button>
            <button class="opt" data-v="monthly">Monthly</button>
          </div>
          <div class="err"></div>`;
        bindOptions(container,onNext);
      },
      display:v => v === "annual" ? "Annual billing" : "Monthly billing"
    },
    {
      key:"seats",
      label:"Seats",
      render(container,onNext){
        renderNumber(container,{
          q:"How many people need a seat this month?",
          hint:"Everyone with login access, including anyone archived but not yet removed from billing.",
          min:1,
          placeholder:"e.g. 8"
        },onNext);
      },
      display:v => `${fmtInt(v)} seat${v==1?"":"s"}`
    },
    {
      key:"usage",
      label:"Usage & activity",

      render(container,onNext){

        container.innerHTML = `
          <p class="q">Tell us about your account activity this month</p>
          <p class="hint">
            Enter your current usage below to estimate your Harvest Flex pricing.
          </p>

          <div class="usage-form">

            <div class="field">
              <label for="projects">
                Active projects this month
              </label>
              <input
                type="number"
                id="projects"
                min="0"
                placeholder="e.g. 6"
              >
            </div>

            <div class="field">
              <label for="tasks">
                Tasks in use this month
              </label>
              <input
                type="number"
                id="tasks"
                min="0"
                placeholder="e.g. 12"
              >
            </div>

            <div class="field">
              <label for="clients">
                Clients you're billing for
              </label>
              <input
                type="number"
                id="clients"
                min="0"
                placeholder="e.g. 5"
              >
            </div>

            <div class="field">
              <label for="invoices">
                Invoices created this month
              </label>
              <input
                type="number"
                id="invoices"
                min="0"
                placeholder="e.g. 4"
              >
            </div>

            <div class="field field-wide">
              <label for="amountInvoiced">
                Total dollar amount invoiced this month
              </label>
              <input
                type="number"
                id="amountInvoiced"
                min="0"
                step="any"
                placeholder="e.g. 15000"
              >
            </div>

            <div class="forecast-field">
              <div>
                <label>Using Forecast for team scheduling?</label>
                <p class="field-hint">
                  A separate add-on, $${FORECAST_ADDON}/seat/month.
                </p>
              </div>

              <div class="options">
                <button type="button" class="opt" data-forecast="yes">
                  Yes
                </button>

                <button type="button" class="opt" data-forecast="no">
                  No
                </button>
              </div>
            </div>

          </div>

          <div class="err" id="usageErr"></div>

          <div class="row-actions">
            <button class="btn" id="usageBtn">
              Continue
            </button>
          </div>
        `;

        const usageErr = container.querySelector("#usageErr");
        const usageBtn = container.querySelector("#usageBtn");

        let forecastValue = null;

        // Forecast selection
        container.querySelectorAll("[data-forecast]").forEach(button => {

          button.addEventListener("click", () => {

            forecastValue = button.dataset.forecast;

            // container
            //   .querySelectorAll("[data-forecast]")
            //   .forEach(btn => btn.classList.remove("selected"));

            // button.classList.add("selected");
            container
                .querySelectorAll("[data-forecast]")
                .forEach(btn => btn.classList.remove("forecast-selected"));

              button.classList.add("forecast-selected");
          });

        });

        function submit(){

          const projects =
            Number(container.querySelector("#projects").value);

          const tasks =
            Number(container.querySelector("#tasks").value);

          const clients =
            Number(container.querySelector("#clients").value);

          const invoices =
            Number(container.querySelector("#invoices").value);

          const amountInvoiced =
            Number(container.querySelector("#amountInvoiced").value);

          const values = [
            { name:"projects", value:projects },
            { name:"tasks", value:tasks },
            { name:"clients", value:clients },
            { name:"invoices", value:invoices },
            { name:"amount invoiced", value:amountInvoiced }
          ];

          const invalid = values.some(item =>
            isNaN(item.value) || item.value < 0
          );

          if(invalid){

            usageErr.textContent =
              "Please enter valid numbers for all usage fields.";

            return;
          }

          if(forecastValue === null){

            usageErr.textContent =
              "Please select whether you use Forecast.";

            return;
          }

          usageErr.textContent = "";

          onNext({
            projects,
            tasks,
            clients,
            invoices,
            amountInvoiced,
            forecast:forecastValue
          });
        }

        usageBtn.addEventListener("click",submit);

        // Allow Enter to submit
        container.querySelectorAll("input").forEach(input => {
          input.addEventListener("keydown",e => {
            if(e.key === "Enter"){
              submit();
            }
          });
        });

        container.querySelector("#projects").focus();
      },

      display:v => "Usage & activity"
    },
    // {
    //   key:"projects",
    //   label:"Projects",
    //   render(container,onNext){
    //     renderNumber(container,{
    //       q:"How many active projects this month?",
    //       min:0,
    //       placeholder:"e.g. 6"
    //     },onNext);
    //   },
    //   display:v => `${fmtInt(v)}`
    // },
    // {
    //   key:"tasks",
    //   label:"Tasks",
    //   render(container,onNext){
    //     renderNumber(container,{
    //       q:"How many tasks are in use this month?",
    //       min:0,
    //       placeholder:"e.g. 12"
    //     },onNext);
    //   },
    //   display:v => `${fmtInt(v)}`
    // },
    // {
    //   key:"clients",
    //   label:"Clients",
    //   render(container,onNext){
    //     renderNumber(container,{
    //       q:"How many clients are you billing for?",
    //       min:0,
    //       placeholder:"e.g. 5"
    //     },onNext);
    //   },
    //   display:v => `${fmtInt(v)}`
    // },
    // {
    //   key:"invoices",
    //   label:"Invoices",
    //   render(container,onNext){
    //     renderNumber(container,{
    //       q:"How many invoices did you create this month?",
    //       min:0,
    //       placeholder:"e.g. 4"
    //     },onNext);
    //   },
    //   display:v => `${fmtInt(v)}`
    // },
    // {
    //   key:"amountInvoiced",
    //   label:"Amount invoiced",
    //   render(container,onNext){
    //     renderNumber(container,{
    //       q:"Total dollar amount invoiced this month?",
    //       min:0,
    //       placeholder:"e.g. 15000",
    //       step:"any"
    //     },onNext);
    //   },
    //   display:v => fmt(Number(v))
    // },
    // {
    //   key:"forecast",
    //   label:"Forecast add-on",
    //   render(container,onNext){
    //     container.innerHTML = `
    //       <p class="q">Using Forecast for team scheduling?</p>
    //       <p class="hint">A separate add-on, $${FORECAST_ADDON}/seat/month.</p>
    //       <div class="options">
    //         <button class="opt" data-v="yes">Yes</button>
    //         <button class="opt" data-v="no">No</button>
    //       </div>
    //       <div class="err"></div>`;
    //     bindOptions(container,onNext);
    //   },
    //   display:v => v === "yes" ? "Yes" : "No"
    // },
    
    {
      key:"email",
      label:"Email",
      render(container,onNext){
        container.innerHTML = `
          <p class="q">Last thing — where should we send your PDF estimate?</p>
          <input type="email" id="inp" placeholder="you@company.com" autocomplete="email">
          <div class="err" id="errBox"></div>
          <div class="row-actions">
            <button class="btn" id="goBtn">Get my estimate</button>
          </div>`;

        const inp = container.querySelector("#inp");
        const err = container.querySelector("#errBox");
        const go = container.querySelector("#goBtn");
        inp.focus();

        function submit(){
          const val = inp.value.trim();
          if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){
            err.textContent = "Enter a valid email address.";
            return;
          }
          onNext(val);
        }

        go.addEventListener("click",submit);
        inp.addEventListener("keydown",e => {
          if(e.key === "Enter") submit();
        });
      },
      display:v => v
    }
  ];

  function bindOptions(container,onNext){
    container.querySelectorAll(".opt").forEach(b => {
      b.addEventListener("click",() => onNext(b.dataset.v));
    });
  }

  function renderNumber(container,opts,onNext){
    container.innerHTML = `
      <p class="q">${opts.q}</p>
      ${opts.hint ? `<p class="hint">${opts.hint}</p>` : ""}
      <input type="number" id="inp" min="${opts.min}" ${opts.step ? `step="${opts.step}"` : ""} placeholder="${opts.placeholder||""}">
      <div class="err" id="errBox"></div>
      <div class="row-actions">
        <button class="btn" id="goBtn">Continue</button>
      </div>`;

    const inp = container.querySelector("#inp");
    const err = container.querySelector("#errBox");
    const go = container.querySelector("#goBtn");
    inp.focus();

    function submit(){
      const raw = inp.value.trim();
      if(raw === "" || isNaN(Number(raw)) || Number(raw) < opts.min){
        err.textContent = `Enter a number of ${opts.min} or more.`;
        return;
      }
      onNext(Number(raw));
    }

    go.addEventListener("click",submit);
    inp.addEventListener("keydown",e => {
      if(e.key === "Enter") submit();
    });
  }

  function updateActivity(){
    document.getElementById("liveSeats").textContent =
      state.seats != null ? fmtInt(state.seats) : "—";
    document.getElementById("liveProjects").textContent =
      state.projects != null ? fmtInt(state.projects) : "—";
    document.getElementById("liveClients").textContent =
      state.clients != null ? fmtInt(state.clients) : "—";
    document.getElementById("liveAmount").textContent =
      state.amountInvoiced != null ? fmt(state.amountInvoiced) : "—";
  }

function showStep(i){

  updateActivity();

  if(i >= steps.length){

    showResults();
    return;

  }

  const step = steps[i];

  step.render(
    document.getElementById("stepArea"),
    value => {

      if(step.key === "usage"){
        Object.assign(state,value);
      }else{
        state[step.key] = value;
      }

      stepIndex = i + 1;
      updateActivity();
      showStep(stepIndex);
    }
  );
}

  function computeHarvest(){
    const seatRate = SEAT_RATE[state.plan][state.billing];
    const seatCost = seatRate * state.seats;
    const projectFee = bandedFee(state.projects,4,COUNT_TABLE);
    const taskFee = bandedFee(state.tasks,3,COUNT_TABLE);
    const clientFee = bandedFee(state.clients,3,COUNT_TABLE);
    const invoiceFee = bandedFee(state.invoices,4,INVOICE_TABLE);
    const amountFee = bandedFee(state.amountInvoiced,3000,AMOUNT_TABLE);
    const forecastCost = state.forecast === "yes"
      ? FORECAST_ADDON * state.seats
      : 0;
    const total =
      seatCost + projectFee + taskFee + clientFee +
      invoiceFee + amountFee + forecastCost;

    return {
      seatRate,seatCost,projectFee,taskFee,clientFee,
      invoiceFee,amountFee,forecastCost,total
    };
  }

  function showResults(){
    const bill = computeHarvest();
    const planLabel = state.plan === "teams" ? "Teams" : "Enterprise";
    const billingLabel = state.billing === "annual" ? "annual" : "monthly";

    document.getElementById("wizardCard").style.display = "none";
    document.getElementById("activityCard").style.display = "none";

    const results = document.getElementById("results");

    results.innerHTML = `
      <div class="results-section">

        <div class="results-main">
          <p class="results-kicker">Current entitlements</p>

          <div class="entitlements">

            <article class="plan-card current">
              <div class="selected">✓</div>
              <div class="plan-badge">▣ &nbsp; Fixed price</div>
              <h2 class="plan-title">${planLabel}</h2>
              <p class="plan-description">Your selected Harvest plan and billing setup</p>
              <div class="plan-price">${fmt(bill.seatCost)} <small>/ period (usage only)</small></div>

              <div class="plan-divider"></div>
              <p class="plan-subtitle">Everything you entered:</p>

              <div class="entitlement-row">
                <span class="entitlement-label">Projects <span class="info">?</span></span>
                <span class="value-pill">${fmtInt(state.projects)} used</span>
              </div>
              <div class="entitlement-row">
                <span class="entitlement-label">Tasks <span class="info">?</span></span>
                <span class="value-pill">${fmtInt(state.tasks)} used</span>
              </div>
              <div class="entitlement-row">
                <span class="entitlement-label">Clients <span class="info">?</span></span>
                <span class="value-pill">${fmtInt(state.clients)} used</span>
              </div>
              <div class="entitlement-row">
                <span class="entitlement-label">Amount invoiced <span class="info">?</span></span>
                <span class="value-pill">${fmt(state.amountInvoiced)}</span>
              </div>
            </article>

            <article class="plan-card">
              <div class="plan-badge">▥ &nbsp; Personalized pricing</div>
              <h2 class="plan-title">Flex</h2>
              <p class="plan-description">Adapts to your account activity</p>
              <div class="plan-price">${fmt(bill.total)} <small>/ period (usage only)</small></div>

              <div class="plan-divider"></div>
              <p class="plan-subtitle">Based on your activity:</p>

              <div class="entitlement-row">
                <span class="entitlement-label">Projects <span class="info">?</span></span>
                <span class="value-pill">${fmtInt(state.projects)} used</span>
              </div>
              <div class="entitlement-row">
                <span class="entitlement-label">Tasks <span class="info">?</span></span>
                <span class="value-pill">${fmtInt(state.tasks)} / period</span>
              </div>
              <div class="entitlement-row">
                <span class="entitlement-label">Clients <span class="info">?</span></span>
                <span class="value-pill">${fmtInt(state.clients)} used</span>
              </div>
              <div class="entitlement-row">
                <span class="entitlement-label">Amount invoiced <span class="info">?</span></span>
                <span class="value-pill">${fmt(state.amountInvoiced)}</span>
              </div>
            </article>

          </div>

          <div class="account-activity">
            <p class="account-title">Account activity: <span>Usage from your estimate</span></p>
            <div class="summary-metrics">
              <div class="summary-metric">
                <div class="summary-number">${fmtInt(state.projects)}</div>
                <div class="summary-label"><span class="metric-icon"></span>Projects</div>
              </div>
              <div class="summary-metric">
                <div class="summary-number">${fmtInt(state.tasks)}</div>
                <div class="summary-label"><span class="metric-icon"></span>Tasks</div>
              </div>
              <div class="summary-metric">
                <div class="summary-number">${fmtInt(state.clients)}</div>
                <div class="summary-label"><span class="metric-icon"></span>Clients</div>
              </div>
              <div class="summary-metric">
                <div class="summary-number">${fmt(state.amountInvoiced)}</div>
                <div class="summary-label"><span class="metric-icon"></span>Amount invoiced</div>
              </div>
            </div>
            <p class="summary-note">
              Seat fees are based on Harvest's published ${planLabel} ${billingLabel} rate.
              Usage fees follow the Flex tiers used by this estimator; intermediate bands
              are estimates rather than an official Harvest rate card.
            </p>
          </div>
        </div>

        <div class="pricing-summary">
          <h2 class="pricing-title">Total pricing summary</h2>

          <div class="price-item">
            <div>
              <div class="price-name">Harvest ${planLabel} Plan</div>
              <div class="price-formula"><strong>${fmt(bill.seatRate)}</strong> × ${fmtInt(state.seats)} seats × 1 period</div>
            </div>
            <div class="price-result">${fmt(bill.seatCost)}</div>
          </div>

          <div class="price-item">
            <div>
              <div class="price-name">Usage &amp; add-on billing</div>
              <div class="price-formula">
                <strong>${fmt(bill.total - bill.seatCost)}</strong> estimated usage/add-ons
              </div>
            </div>
            <div class="price-result">${fmt(bill.total - bill.seatCost)}</div>
          </div>

          <div class="total">
            <div class="total-label">Total cost</div>
            <div class="total-value">${fmt(bill.total)} <small>/ period</small></div>
          </div>

          <p class="usage-note">
            This estimate is based on the answers you provided. For non-USD invoices,
            currency conversion and Harvest's actual billing treatment may differ.
          </p>

          <div id="confirmArea"></div>

          <div class="restart">
            <button class="btn ghost" id="restartBtn">Start a new estimate</button>
          </div>
        </div>

      </div>`;

    const confirmArea = document.getElementById("confirmArea");

    confirmArea.innerHTML = `
      <div class="confirm pending" id="confirmBox">
        Saving your estimate…
      </div>`;

    const confirmBox = document.getElementById("confirmBox");

    fetch("/api/submit",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(state)
    })
    .then(async r => {
      const json = await r.json();
      if(!r.ok) throw new Error(json.error || "Request failed");

      if(json.stored){
        confirmBox.className = "confirm";
        confirmBox.innerHTML = "Your estimate has been saved successfully.";
      }else{
        throw new Error("The estimate could not be saved.");
      }
    })
    .catch(e => {
      console.error("Submission error:",e);
      confirmBox.className = "confirm error";
      confirmBox.innerHTML = "Couldn't save your estimate. Please try again.";
    });

    document.getElementById("restartBtn").addEventListener("click",() => {
      Object.keys(state).forEach(k => delete state[k]);
      stepIndex = 0;
      results.innerHTML = "";
      document.getElementById("wizardCard").style.display = "";
      document.getElementById("activityCard").style.display = "";
      showStep(0);
    });
  }

  showStep(0);
})();
</script>
